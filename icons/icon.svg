  </g>
  <rect x="146" y="233" width="220" height="14" rx="7" fill="#ffffff" opacity="0.55"/>

  <!-- forge sparks -->
  <path d="M340 118c0 16-14 30-30 30 16 0 30 14 30 30 0-16 14-30 30-30-16 0-30-14-30-30Z" fill="url(#spark)"/>
  <path d="M300 168c0 9-7.5 16.5-16.5 16.5C292.5 184.5 300 192 300 201c0-9 7.5-16.5 16.5-16.5C307.5 184.5 300 177 300 168Z" fill="url(#spark)" opacity="0.9"/>
